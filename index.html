window.PHYSICS_CONTENT = {
  "topics": [
    {
      "id": "motion",
      "title": "运动与图像",
      "en": "Motion & graphs",
      "tagline": "看斜率，算面积，先选正方向。",
      "minutes": 22,
      "icon": "↗",
      "summary": "把文字转成运动图像：速率描述快慢，速度还包含方向。计算前统一 m、s，再决定用斜率还是面积。",
      "points": [
        {
          "title": "Distance ≠ displacement",
          "body": "路程是沿途走过的总长度；位移是从起点指向终点的变化。平均速率 = 总路程 ÷ 总时间；平均速度 = 位移 ÷ 总时间。往返起点时，平均速度可以为零。"
        },
        {
          "title": "两类图，两个读法",
          "body": "位移–时间图的斜率是速度；速度–时间图的斜率是加速度。速度–时间图的有符号面积是位移，各段面积绝对值相加才是总路程。若纵轴写 speed，面积就是路程。"
        },
        {
          "title": "Uniform acceleration",
          "body": "只有加速度恒定时才能直接用 v = u + at、s = ut + ½at²。先写清正方向：向上为正时，忽略空气阻力的竖直运动 a = −g。"
        },
        {
          "title": "Terminal velocity",
          "body": "物体下落加速时，空气阻力通常增大。阻力与重力平衡后，合力为零、加速度为零，但速度不为零。终端速度不是“重力消失”。"
        }
      ],
      "formulas": [
        {
          "formula": "v̄ = total distance / total time",
          "meaning": "平均速率，包含停留时间",
          "units": "m s⁻¹"
        },
        {
          "formula": "a = (v − u) / t",
          "meaning": "速度变化率；u 初速度、v 末速度",
          "units": "m s⁻²"
        },
        {
          "formula": "s = ½(u + v)t",
          "meaning": "匀加速时的位移，等于梯形面积",
          "units": "m"
        },
        {
          "formula": "v² = u² + 2as",
          "meaning": "学校讲义的匀加速扩展公式，无时间量",
          "units": "所有量使用 SI 单位"
        }
      ],
      "pitfalls": [
        "不要把 velocity–time 图上的负速度直接丢掉。负号表示方向。",

      "example": {
        "question": "A cyclist speeds up uniformly from 2.0 m/s to 8.0 m/s in 3.0 s. Find the acceleration and distance travelled.",
        "steps": [
          "a = (8.0 − 2.0) / 3.0 = 2.0 m s⁻²",
          "速度始终为正，路程等于 v–t 图面积。",
          "s = ½ × (2.0 + 8.0) × 3.0 = 15 m"
        ],
        "answer": "a = 2.0 m s⁻²；distance = 15 m"
      },
      "sourceRefs": [
        "学校 Booklet 1 · PDF p30–47",
        "Cambridge 0625 · 2026–2028 §1.2"
      ]
    },
    {
      "id": "forces",
      "title": "力、动量与压强",
      "en": "Forces & momentum",
      "tagline": "先画受力图，再写合力。",

      "icon": "⇄",
      "summary": "力改变运动状态；平衡需要同时考虑平移和转动。动量守恒、压强和弹簧问题都从系统与方向开始。",
      "points": [
        {
          "title": "Resultant force",
          "body": "F = ma 中的 F 是同一物体所受的合力。合力为零表示静止或匀速直线运动；第三定律的作用力与反作用力作用在不同物体上，不在同一张受力图中相消。"
        },
        {
          "title": "Moments & stability",
          "body": "力矩 = 力 × 支点到作用线的垂直距离。平衡时合力为零且顺、逆时针力矩相等。重心越低、支撑面越宽，物体通常越稳定。"
        },
        {
          "title": "Momentum & impulse",
          "body": "取定正方向后，把速度带符号代入 p = mv。系统无外界合冲量时，总动量守恒。安全气囊延长相同动量变化所需的时间，因此减小平均作用力。"
        },
        {
          "title": "Density & pressure",
          "body": "密度比较相同体积中含多少质量。压强取垂直力与接触面积之比；液体中随深度增加的压强为 ρgh，绝对压强还要加液面上方压强。"
        },
        {
          "title": "Springs & circular motion",
          "body": "比例极限以内，弹簧力与伸长量成正比。匀速圆周运动的速率不变，但速度方向不断改变，因此仍有指向圆心的合力。"
        }
      ],
      "formulas": [
        {
          "formula": "F = ma；W = mg",
          "meaning": "合力与重量不是同一个量",
          "units": "F、W：N；m：kg"

        {
          "formula": "moment = Fd⊥",
          "meaning": "d⊥ 是垂直力臂",
          "units": "N m"
        },
        {
          "formula": "p = mv；FΔt = Δp",
          "meaning": "动量与合力的冲量",
          "units": "kg m s⁻¹；N s"
        },
        {
          "formula": "ρ = m/V；p = F/A；Δp = ρgh",

        {

      "pitfalls": [

      "sourceRefs": [
        "学校 Booklet 1 · PDF p48–81、94–106",
        "Cambridge 0625 · §1.3–1.6、1.8"
      ]
    },
    {
      "id": "energy",
      "title": "能量、功与效率",
      "en": "Energy & power",
      "tagline": "能量不会消失，只会转移或耗散。",
      "minutes": 18,
      "icon": "⚡",
      "summary": "先找能量的初态与末态，再判断哪些过程做功。功率是能量转移的快慢，效率是有用输出所占的比例。",
      "points": [
        {
          "title": "Energy account",
          "body": "能量守恒适用于完整系统。摩擦把机械能转移到物体和环境的内能，称为耗散；不是能量被“用完”或被毁灭。"

        {

document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;
if(a==='topic')showTopic(id);
else if(a==='read'){if(!state.read.includes(id)){state.read.push(id);save();}el.textContent='✓ 已标记读过';toast('已记录阅读进度；掌握程度由练习结果更新。');}
else if(a==='topic-quiz'){document.getElementById('topic-dialog').close();startQuiz(C.questions.filter(q=>q.topic===id).map(q=>q.id),id);go('practice?topic='+id);}
else if(a==='task'){const i=state.tasks.indexOf(id);if(i===-1)state.tasks.push(id);else state.tasks.splice(i,1);save();render();}
else if(a==='answer'&&!graded){selected=Number(el.dataset.index);render();}
else if(a==='submit'&&!graded&&selected!==null){const q=quiz.questions[quiz.index];graded=true;const correct=selected===q.answer;const prev=state.answers[q.id];state.answers[q.id]={selected,correct,attempts:(prev?.attempts||0)+1,last:new Date().toISOString()};quiz.results.push({id:q.id,correct});save();render();}
else if(a==='next'&&graded){quiz.index++;selected=null;graded=false;render();window.scrollTo({top:0,behavior:'smooth'});}
else if(a==='restart'){startQuiz(null,'mixed');go('practice');}
else if(a==='wrong-quiz'){const ids=wrongIds();if(!ids.length){toast('目前没有待复习错题。');return;}startQuiz(ids,'mistakes');go('practice');}
else if(a==='single-quiz'){startQuiz([id],'mistakes');go('practice');}
else if(a==='lab'){lab=id;labPlaying=false;lastFrame=0;if(raf)cancelAnimationFrame(raf);raf=null;render();}
else if(a==='wave-play'){labPlaying=!labPlaying;if(labPlaying&&!raf)raf=requestAnimationFrame(waveFrame);}
else if(a==='print')window.print();
});
document.addEventListener('input',e=>{if(e.target.id==='topic-search'){const s=e.target.value.toLowerCase();document.getElementById('topic-results').innerHTML=C.topics.filter(t=>(t.title+' '+t.en+' '+t.tagline+' '+t.summary).toLowerCase().includes(s)).map(topicCard).join('')||'<p>没有匹配的主题，换一个关键词试试。</p>';}
if(e.target.id==='formula-search')document.getElementById('formula-results').innerHTML=formulaCards(e.target.value);
if(e.target.matches('.control input'))updateLab();});
document.addEventListener('change',e=>{if(e.target.id==='quiz-topic'){const t=e.target.value;if(t==='mistakes'){const ids=wrongIds();if(!ids.length){toast('目前没有待复习错题。');render();return;}startQuiz(ids,'mistakes');}else if(t==='mixed')startQuiz(null,'mixed');else startQuiz(C.questions.filter(q=>q.topic===t).map(q=>q.id),t);if(location.hash.includes('?'))location.hash='practice';else render();}});
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus();main.scrollIntoView({behavior:'smooth'});});
document.querySelectorAll('.dialog-close').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}}));
document.getElementById('topic-dialog').addEventListener('close',()=>{if(route==='topics'||route==='overview')render();});
function timerText(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function timerUI(){if(timerEnd)timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));document.getElementById('timer-display').textContent=timerText(timerRemaining);document.getElementById('timer-label').textContent=timerEnd?timerText(timerRemaining):timerRemaining===1500?'专注 25 分钟':timerText(timerRemaining);document.getElementById('timer-toggle').textContent=timerEnd?'暂停':timerRemaining===1500?'开始专注':'继续专注';if(timerEnd&&timerRemaining===0){timerEnd=null;clearInterval(timerInterval);timerInterval=null;state.focusMinutes+=25;save();toast('25 分钟专注完成。站起来，休息一下。');timerRemaining=1500;timerUI();if(route==='overview')render();}}
document.getElementById('focus-btn').addEventListener('click',()=>{timerUI();document.getElementById('focus-dialog').showModal();});
document.getElementById('timer-toggle').addEventListener('click',()=>{if(timerEnd){timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerEnd=null;clearInterval(timerInterval);timerInterval=null;}else{timerEnd=Date.now()+timerRemaining*1000;timerInterval=setInterval(timerUI,500);}timerUI();});
document.getElementById('timer-reset').addEventListener('click',()=>{timerEnd=null;clearInterval(timerInterval);timerInterval=null;timerRemaining=1500;timerUI();});
document.getElementById('export-btn').addEventListener('click',()=>{const data=JSON.stringify({app:'Physics Lab',exportedAt:new Date().toISOString(),...state},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='physics-lab-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('学习记录已导出。');});
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'});});
render();
if(!storageOK)toast('当前浏览器无法读取本地记录，将从空白进度开始。');
window.PHYSICS_LAB={getState:()=>JSON.parse(JSON.stringify(state)),topicProgress};
})();
</script></body></html>
