<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12576b">
<title>物理自习室 · Physics Lab</title>
<meta name="author" content="Ktyu白驹过隙">
<meta name="description" content="Cambridge IGCSE 0625 物理复习手册。IGCSE Physics 中文讲解、互动实验、原创练习与历年真题入口。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%2312576b'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='47' fill='%23f4eee1'%3Eφ%3C/text%3E%3C/svg%3E">
<style>:root {
  color-scheme: light;
  --ink:#192d40; --teal:#12576b; --muted:#596671; --teal-light:#e5eff0;
  --bg:#f9f7f1; --paper:#fffefa; --line:#cbd0cb; --orange:#a65329;
  --serif:Georgia,"Songti SC","Noto Serif CJK SC",SimSun,serif;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --rail:200px; --edge:clamp(24px,3.5vw,64px);
}
* {box-sizing:border-box}
body {margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select {font:inherit;color:inherit}
button,summary,select {cursor:pointer}
button:disabled {cursor:default;opacity:.55}
a {color:inherit;text-decoration:none}
:where(a,button,input,textarea,select,summary,[tabindex]):focus-visible {outline:3px solid #996022;outline-offset:3px}
a:hover {color:var(--teal)}
button {background:transparent}
h1,h2,h3,p,figure,dl,dd {margin:0}
h1,h2,h3 {text-wrap:pretty}
svg {vertical-align:middle}
::selection {background:#d7e7e9}
.visually-hidden {position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip {position:fixed;left:16px;top:-80px;z-index:100;background:var(--ink);color:white;padding:10px}
.skip:focus {top:8px}
.sidebar {position:fixed;inset:0 auto 0 0;width:var(--rail);background:#f3f2ec;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.brand-row {padding:32px 20px 28px}
.brand {display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:10px;font:600 21px/1.3 var(--serif);color:var(--ink)}
.brand-author {grid-column:2;font:400 11px/1.5 var(--font);color:var(--muted)}
.brand-symbol {font:italic 35px/1 Georgia,serif;color:var(--teal)}
.nav-toggle {display:none}
.site-menu {padding:0 14px;overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column}
.nav-label {margin:18px 12px 6px;font-size:12px;color:var(--muted)}
.site-menu nav {display:grid;gap:2px}
.site-menu nav a {min-height:38px;display:flex;align-items:center;gap:10px;padding:6px 12px;border-left:2px solid transparent;font-size:14px}
.site-menu nav svg,.focus-btn svg {width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;flex:none}
.site-menu nav a:hover {background:#e9e9e1}
.site-menu nav a.active {border-left-color:var(--teal);color:var(--teal);background:#e1e8e6;font-weight:650}
.site-menu nav em {margin-left:auto;font-style:normal;font-size:12px;font-variant-numeric:tabular-nums}
.profile {margin:auto 10px 0;padding:24px 0 20px;color:var(--muted);font-size:11px}
.export-btn {border:0;border-top:1px solid var(--line);padding:7px 0;margin-top:5px;text-align:left;width:100%;font-size:13px;color:var(--teal)}
.export-btn span,.practice-pick span {float:right}
.app-shell {margin-left:var(--rail);min-width:0}
.topbar,main,footer {width:min(100%,1560px);margin-inline:auto;padding-inline:var(--edge)}
.topbar {min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.breadcrumb {display:flex;gap:12px;align-items:baseline;color:var(--muted);font-size:12px}
.breadcrumb span[lang] {font:italic 16px var(--serif)}
.breadcrumb strong {font-weight:500}
.focus-btn {display:flex;align-items:center;gap:7px;border:0;font-size:12px;min-height:40px}
main {padding-block:32px 48px;min-height:calc(100vh - 120px);min-width:0;outline:none}
footer {display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-block:14px;font-size:12px;color:var(--muted)}
footer a,.text-link,.cover-secondary,.cover-figure a,.feedback-links a,.source-card a {color:var(--teal);text-decoration:underline;text-underline-offset:4px;text-decoration-color:#8ba8ad}
.page-intro {margin:0 0 24px}
.page-intro h1,.book-cover h1 {font-family:var(--serif);font-weight:600;color:var(--ink)}
.page-intro h1 {font-size:clamp(30px,3vw,42px);line-height:1.3}
.page-intro p {margin-top:8px;color:var(--muted);font-size:14px}
.eyebrow,.field-hint,.hint,.review-guide,.dialog-sources {font-size:13px;color:var(--muted)}
.btn,.print-button {display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:42px;padding:9px 17px;border-radius:3px;border:1px solid transparent;font:600 14px/1.45 var(--font)}
.primary {background:var(--teal);color:white}
.primary:hover {background:#0c4657;color:white}
.secondary,.print-button {border-color:#a8b7b8;background:var(--paper);color:var(--teal)}
.secondary:hover,.print-button:hover {border-color:var(--teal)}
.ghost {color:var(--teal)}
.button-row,.toolbar,.dialog-actions,.feedback-links,.cause-control {display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.book-cover {display:grid;grid-template-columns:1fr 1.06fr;align-items:center;gap:clamp(22px,3vw,56px);padding:0 0 24px}
.cover-text {min-width:0}
.subject-line {color:var(--teal);font:500 15px/1.4 var(--font)}
.subject-line span {border-left:1px solid #9ba6a4;padding-left:10px;margin-left:7px}
.book-cover h1 {font-size:clamp(38px,4.1vw,72px);line-height:1.25;margin:12px 0 14px;letter-spacing:-.025em}
.cover-blurb {font-size:clamp(15px,1.18vw,19px);color:#384857;max-width:26em;line-height:1.8}
.cover-contents {margin:12px 0 20px;color:var(--muted);font-size:13px}
.cover-secondary {border:0;font-size:14px;padding:9px 6px}
.cover-figure {margin:0;min-width:0}
.cover-figure img {width:100%;height:auto;aspect-ratio:1.6;object-fit:contain;display:block;background:#ddd9cf}
.cover-figure figcaption {display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:8px 0 0;color:var(--muted);font-size:12px}
.cover-figure i {font:italic 12px var(--serif);margin-left:4px}
.record-strip {border-block:1px solid var(--line);margin:0 0 28px}
.record-strip summary {padding:12px 0;font-size:14px}
.record-strip summary strong {font-weight:600;margin-right:14px}
.record-strip summary span {color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.record-strip dl,.result-grid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:15px 0}
.record-strip dt,.result-stat span {font-size:12px;color:var(--muted)}
.record-strip dd,.result-stat strong {font-size:22px;font-variant-numeric:tabular-nums}
.record-strip>p {color:var(--muted);font-size:12px;margin:0 0 12px}
.desk-index {display:grid;grid-template-columns:minmax(0,1.9fr) minmax(190px,.8fr);gap:clamp(24px,3vw,48px)}
.section-heading {display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:0 0 12px}
.section-heading h2,.bench-link h2,.learning-next h2 {font:600 23px/1.4 var(--serif)}
.text-link {font-size:13px}
.topic-grid {display:grid;border-top:2px solid var(--ink)}
.topic-card {display:grid;grid-template-columns:2em minmax(0,1fr) auto;align-items:center;gap:14px;padding:13px 6px 13px 2px;border:0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.topic-card:hover,.practice-pick:hover,.study-link:hover {background:#efeee6}
.topic-index {color:var(--orange);font:15px/1 ui-monospace,monospace;font-variant-numeric:tabular-nums}
.topic-title {font:600 18px/1.5 var(--serif)}
.topic-title small {display:block;font:400 12px/1.6 var(--font);color:var(--muted)}
.topic-status {color:var(--muted);font-size:12px;text-align:right}
.practice-index .section-heading {margin-bottom:0;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.practice-pick,.study-link {display:block;width:100%;border:0;border-bottom:1px solid var(--line);padding:12px 2px;text-align:left;color:var(--ink);font-size:15px}
.practice-pick span {color:var(--teal)}
.study-link strong {font-weight:600}
.study-link small {color:var(--muted);display:block}
.bench-link {border-block:1px solid var(--line);padding:20px 0;margin-top:30px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.bench-link p {color:var(--muted);font-size:14px;margin-top:5px}
.panel, .empty-state {background:var(--paper);border:1px solid var(--line);padding:clamp(16px,2.2vw,36px)}
.panel h2,.empty-state h2 {font:600 23px/1.45 var(--serif)}
.learning-next {margin:0 0 28px;background:transparent;border:0;border-left:3px solid var(--orange);padding:2px 0 2px 16px}
.learning-next h2 {font-size:19px}
.learning-next>p,.learning-next article span {color:var(--muted);font-size:13px}
.learning-next article {display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;padding:9px 0}
.learning-next article strong {font-size:14px}
.feedback-links {gap:6px 16px;font-size:13px}
.toolbar {margin-bottom:20px}
.search-input,.quiz-topic-select,.practice-scope select,.cause-control select {border:1px solid #acb8ba;background:var(--paper);padding:9px 12px;min-height:40px;border-radius:2px}
.search-input {width:min(410px,100%);max-width:100%}
.all-topics {grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px}
.wide-note,.source-notes,.review-guide {margin:24px 0;font-size:13px;color:var(--muted)}
.quiz-layout {display:grid;grid-template-columns:minmax(0,1fr) minmax(204px,.36fr);align-items:start;gap:24px}
.quiz-layout>* {min-width:0}
.quiz-meta,.quiz-actions {display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.quiz-meta {font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.scope-tag {color:var(--teal);font-size:12px}
.scope-tag.school {color:var(--orange)}
.progress-track {height:3px;background:#e3e5df;margin:12px 0}
.progress-track span {display:block;height:100%;background:var(--teal)}
.panel .question {font:500 clamp(20px,2vw,28px)/1.5 var(--serif);color:var(--ink);white-space:pre-line;margin:24px 0}
.options {display:grid;gap:8px}
.option {display:flex;align-items:center;text-align:left;gap:14px;border:1px solid var(--line);padding:12px 16px;border-radius:2px;background:var(--paper);font-size:16px}
.option .letter {display:grid;place-items:center;font:600 13px var(--font);width:26px;height:26px;border:1px solid #b1bcbd;border-radius:50%;flex:none}
.option:hover,.option.selected {background:#eaf1f2;border-color:var(--teal)}
.option.selected .letter {background:var(--teal);border-color:var(--teal);color:white}
.option.correct,.feedback {background:#e9f2eb;border-color:#638a69}
.option.wrong,.feedback.wrong {background:#faeee4;border-color:#b67754}
.option:disabled {opacity:1}
.option-content {min-width:0}
.feedback {margin-top:20px;border-left:3px solid #638a69;padding:14px 18px}
.feedback strong {display:block;margin-bottom:5px}
.feedback-links,.cause-control {margin-block:8px}
.cause-control {font-size:13px}
.quiz-actions {margin-top:20px}
.quiz-sidebar {display:grid;gap:16px}
.quiz-sidebar .panel {border:0;border-top:2px solid var(--ink);padding:12px 0;background:transparent}
.quiz-sidebar h3,.practice-scope {display:block;font-size:14px;font-weight:600;margin:0 0 8px}
.quiz-sidebar p,.hint {font-size:13px;color:var(--muted)}
.practice-scope select,.quiz-topic-select {width:100%;margin:5px 0 14px}
.score-big {font:500 40px/1.4 var(--serif);font-variant-numeric:tabular-nums}
.score-big small {font:16px var(--font);color:var(--muted)}
.question-nav {display:flex;gap:4px;flex-wrap:wrap;margin-top:12px;max-height:180px;overflow:auto}
.question-dot {display:grid;place-items:center;min-width:24px;height:24px;border:1px solid var(--line);font-size:11px}
.question-dot.current {border-color:var(--teal);font-weight:700}
.question-dot.done {background:#e0ede1}
.question-dot.bad {background:#f4decf}
.question-figure,.option-figure {display:block;overflow-x:auto;max-width:100%;margin:16px 0;background:var(--paper)}
.question-figure svg,.option-figure svg {display:block;width:100%;min-width:420px;height:auto}
.option-figure svg {min-width:180px;max-width:360px}
.result-grid {grid-template-columns:repeat(3,1fr)}
.result-stat strong,.result-stat span {display:block}
.empty-state {padding:48px 24px;text-align:center}
.empty-state p {margin:8px 0 20px;color:var(--muted)}
.empty-symbol {color:var(--teal);font-size:30px}
.mistake-list,.formula-grid,.source-grid,.paper-cards {display:grid;gap:16px}
.mistake-card {display:flex;align-items:flex-start;gap:20px;justify-content:space-between;padding:20px 0;border-top:1px solid var(--line)}
.mistake-body {min-width:0}
.mistake-body h3 {margin:6px 0;font:500 20px/1.5 var(--serif)}
.mistake-body p {font-size:13px;color:var(--muted)}
.mistake-card>.btn {flex:none}
.formula-grid,.paper-cards {grid-template-columns:repeat(3,minmax(0,1fr))}
.formula-card,.source-card {padding:16px 0;border-top:2px solid var(--ink)}
.formula-card h3 {font:600 16px/1.5 var(--font);color:var(--ink)}
.formula-topic,.formula-card p,.source-card p,.source-card a {font-size:13px;color:var(--muted)}
.formula-card h3 {margin:8px 0}
.formula-card .meaning,.source-card h3 {margin-bottom:6px}
/* The same book entry is used in quick lookup, topic notes and print. */
.formula-books {display:flex;gap:6px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:20px 0}
.formula-books a {display:flex;align-items:baseline;gap:.55em;flex-wrap:wrap;padding:9px 3px;border-bottom:3px solid transparent}
.formula-books a span {font-size:13px;color:var(--muted)}
.formula-books a[aria-current] {border-color:var(--teal);color:var(--teal)}
.formula-volume {margin:20px 0}
.formula-volume h2 {font:600 21px var(--serif);margin:24px 0 12px}
.formula-chapter {border-bottom:1px solid var(--line)}
.formula-chapter summary {padding:14px 0;font-size:17px;font-weight:600;color:var(--ink)}
.formula-chapter summary::marker {color:var(--teal)}
.formula-chapter .formula-grid {grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));column-gap:24px;row-gap:0}
.formula-volume .formula-card,.topic-formulas .formula-card {min-width:0;border:0;border-top:1px solid var(--line);padding:12px 0 16px}
.formula-card h3 {margin:0 0 5px}
.book-equation {max-width:100%;overflow-x:auto;padding:6px 1px 8px;color:var(--teal);font-size:clamp(17px,1.4vw,22px)}
.book-equation math {display:block;width:max-content;font-family:math}
.formula-card small {display:block;color:var(--muted);font-size:12px;margin-top:4px}
.topic-formulas {display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,265px),1fr));gap:0 20px}
@media(max-width:640px) {
  .formula-books {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .formula-books a {display:block}
  .formula-books a span {display:block;font-size:12px}
}
.source-grid {grid-template-columns:repeat(2,minmax(0,1fr));margin:24px 0}
.source-notes h3,.paper-guide h2 {color:var(--ink)}
.paper-hero {display:flex;align-items:center;justify-content:space-between;gap:24px;border-block:1px solid var(--line);padding:22px 0;margin:0 0 24px}
.paper-hero h2 {font:600 26px/1.5 var(--serif);margin:5px 0}
.paper-hero p,.paper-guide li,.source-notes li,.scope-guide li {margin:6px 0}
.paper-hero a {flex:none}
.paper-guide {margin-top:24px}
#toast {position:fixed;z-index:110;bottom:24px;left:50%;max-width:92vw;transform:translate(-50%,12px);padding:12px 18px;background:var(--ink);color:white;opacity:0;pointer-events:none;border-radius:3px;font-size:13px}
#toast.show {opacity:1;transform:translate(-50%,0)}
dialog {color:var(--ink);background:var(--paper);border:1px solid #a6adad;padding:clamp(20px,3vw,42px);width:min(680px,94vw);max-height:88vh}
dialog::backdrop {background:rgb(23 36 45 / .45)}
.dialog-close {float:right;border:1px solid var(--line);width:34px;height:34px;line-height:1;font-size:22px}
.dialog-title,.focus-dialog-body h2 {font:600 30px/1.4 var(--serif)}
.dialog-title-en,.dialog-summary {color:var(--muted);margin:5px 0 12px}
.point,.formula-row {border-bottom:1px solid var(--line);padding:12px 0}
.point h3,.dialog-section {font-size:17px}
.dialog-section,.dialog-actions,.dialog-sources {margin-top:22px}
.formula-row {display:flex;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.formula-row small,.pitfalls {color:var(--muted)}
.worked {background:#f1f0e9;padding:16px}
.worked summary {color:var(--teal);margin-top:8px}
#import-dialog {width:min(460px,94vw)}
#import-title {font:600 25px/1.4 var(--serif)}
#import-help,.restore-warning,#import-summary {margin:12px 0;font-size:14px}
#import-help b {overflow-wrap:anywhere}
.backup-file {display:block;margin:16px 0;font-size:14px;font-weight:600}
.backup-file input {display:block;width:100%;margin-top:6px;font-size:14px}
#import-status {color:var(--teal);font-size:14px}
#import-status.error {color:#8d321b}
#import-preview {border-top:1px solid var(--line);padding-top:12px}
#import-summary {color:var(--muted)}
#import-summary span {display:block}
.restore-warning {padding-left:12px;border-left:2px solid var(--orange)}
#timer-display {font:500 56px/1.5 var(--serif);font-variant-numeric:tabular-nums}
.focus-dialog-body .button-row {margin-top:16px}
@media (min-width:1500px) {.desk-index .topic-grid {grid-template-columns:repeat(2,minmax(0,1fr));column-gap:22px}}
@media (max-width:1030px) {
  :root {--rail:172px;--edge:24px}
  .brand-row {padding:26px 16px 18px}
  .brand {font-size:18px}
  .site-menu {padding:0 8px}
  .quiz-layout {grid-template-columns:minmax(0,1fr) 200px;gap:16px}
  .all-topics,.formula-grid {grid-template-columns:repeat(2,minmax(0,1fr))}
  .cover-figure figcaption {flex-wrap:wrap}
}
@media (max-width:760px) {
  :root {--edge:18px}
  .sidebar {position:relative;width:100%;display:block;border-right:0;border-bottom:1px solid var(--line)}
  .brand-row {display:flex;align-items:center;justify-content:space-between;padding:9px var(--edge)}
  .brand {font-size:19px}
  .brand-symbol {font-size:29px}
  .nav-toggle {display:block;padding:6px 11px;border:1px solid var(--line);border-radius:2px;font-size:13px}
  .nav-toggle span {margin-left:4px}
  .site-menu {display:none;padding:0 var(--edge) 10px}
  .site-menu.expanded {display:block}
  .site-menu nav {grid-template-columns:repeat(2,minmax(0,1fr))}
  .site-menu nav a {min-height:44px}
  .nav-label {margin:12px 0 4px}
  .profile {margin:8px 0 0;padding:8px 0 0;border-top:1px solid var(--line)}
  .record-actions {display:flex;gap:20px}
  .export-btn {width:auto;min-height:38px;margin:0;border:0}
  .app-shell {margin:0}
  .topbar {min-height:40px}
  main {padding-block:20px 32px}
  .book-cover {grid-template-columns:1.1fr 1fr;gap:16px}
  .book-cover h1 {font-size:34px}
  .subject-line,.cover-contents {font-size:12px}
  .cover-blurb {font-size:14px}
  .desk-index {grid-template-columns:minmax(0,1.5fr) minmax(150px,1fr);gap:22px}
  .quiz-layout {grid-template-columns:1fr}
  .quiz-sidebar {grid-template-columns:1fr 1fr}
  .paper-hero,.mistake-card {align-items:flex-start;flex-direction:column}
  .paper-cards {grid-template-columns:1fr}
}
@media (max-width:560px) {
  .book-cover {grid-template-columns:minmax(0,1fr);gap:16px;padding-bottom:16px}
  .book-cover h1 {font-size:38px;margin:8px 0}
  .cover-blurb {max-width:100%}
  .cover-contents {margin:8px 0 12px}
  .desk-index,.source-grid,.all-topics,.quiz-sidebar,.formula-grid {grid-template-columns:1fr}
  .record-strip dl {grid-template-columns:1fr 1fr}
  .section-heading h2,.bench-link h2 {font-size:21px}
  .bench-link {flex-wrap:wrap;gap:12px}
  .topic-card {gap:8px}
  .cover-figure i {display:none}
  .result-grid {gap:8px}
  .quiz-actions {align-items:flex-start}
  .record-strip {margin-bottom:20px}
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after {scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
@media print {
  .sidebar,.topbar,footer,.toolbar,.skip,#toast {display:none!important}
  .app-shell {margin:0} main {padding:0} body {background:white}
  .formula-books {display:none}

      "summary": "实验题考的是可操作的设计和有依据的结论。每个改进都应对应一个明确误差来源，而不是笼统地“更小心”。",
      "points": [
        {
          "title": "Choose the variables",
          "body": "自变量是主动改变的量，因变量是测量的结果；控制变量是要保持不变的条件。研究摆长与周期时改变摆长、测周期，并保持摆幅较小且近似相同。"
        },
        {
          "title": "Measurement habits",
          "body": "读尺和液面时视线垂直刻度，减少视差。先检查零点。短时间可测多次振动的总时间再除以次数；随机误差可通过重复和平均减小。"
        },
        {
          "title": "Graph for a relationship",
          "body": "横轴一般为自变量，纵轴为因变量，标签写“quantity / unit”。合理选择刻度使数据占据较大面积；画最佳拟合线，不逐点折线相连，除非题目明确要求。"
        },
        {
          "title": "Random vs systematic",
          "body": "随机误差造成读数散布；系统误差使读数持续偏向同一方向。重复读数不能消除天平固定的零误差；应校零或减去偏差。"
        },
        {
          "title": "Conclusion with evidence",
          "body": "先写趋势，再用数据或图线支持。直线通过原点才支持正比例。异常点应检查和重测，不为得到想要的结果而随意删除。评估时写出误差、影响和具体改进。"
        }
      ],

    try { file = JSON.parse(text.replace(/^\uFEFF/, '')); }
    catch (_) { throw new Error('无法读取 JSON 文件，请选择从物理自习室下载的学习记录。'); }
    // Bound nesting and reject prototype keys before passing anything to the live models.
    function inspect(value, depth) {
      if (value === null || typeof value !== 'object') return;
      requireValid(depth < 20, '数据层级');
      for (const key of Object.keys(value)) {
        requireValid(key !== '__proto__' && key !== 'prototype' && key !== 'constructor', '数据字段');
        inspect(value[key], depth + 1);
      }
    }
    inspect(file, 0);
    return file;
  }

  function mainRecord(file) {
    const topics = new Set(window.PHYSICS_CONTENT.topics.map(t => t.id));
    const bank = new Map(window.PHYSICS_CONTENT.questions.map(q => [q.id, q]));
    requireValid(Array.isArray(file.read) && file.read.every(id => topics.has(id)), '主题阅读记录');
    requireValid(Array.isArray(file.tasks) && file.tasks.every(identifier), '学习任务');
    requireValid(integer(file.focusMinutes), '专注分钟数');
    requireValid(object(file.answers), '练习记录');
    const answers = {};
    for (const [id, a] of Object.entries(file.answers)) {
      const q = bank.get(id);
      requireValid(q && object(a) && bool(a.correct) && integer(a.selected) && a.selected < q.options.length, '练习答案');
      requireValid(!own(a, 'attempts') || (integer(a.attempts) && a.attempts > 0), '作答次数');
      requireValid(!own(a, 'version') || integer(a.version), '练习版本');
      requireValid(!own(a, 'last') || (typeof a.last === 'string' && a.last.length <= 64 && Number.isFinite(Date.parse(a.last))), '作答时间');
      const answer = { selected: a.selected, correct: a.correct, attempts: a.attempts || 1 };
      if (a.version !== undefined) answer.version = a.version;
      if (a.last !== undefined) answer.last = a.last;
      answers[id] = answer;
    }
    return { read: [...new Set(file.read)], answers, tasks: [...new Set(file.tasks)], focusMinutes: file.focusMinutes };
  }

  function courseRecord(course) {
    requireValid(object(course) && (!own(course, 'version') || [1, 2].includes(course.version)), '课堂版本');
    requireValid(Array.isArray(course.done) && object(course.notes) && integer(course.active), '课堂记录');
    requireValid(!own(course, 'scope') || scopes.includes(course.scope), '课程范围');
    requireValid(!own(course, 'checkpoints') || object(course.checkpoints), '阶段检查');
    const out = window.PhysicsCourse.model.normalize(course, window.PHYSICS_COURSE);
    requireValid(course.active === out.active && course.done.every(id => out.done.includes(id)), '课节进度');
    for (const [id, note] of Object.entries(course.notes)) requireValid(own(out.notes, id) && out.notes[id] === note, '课节笔记');
    for (const [id, record] of Object.entries(course.checkpoints || {})) {
      const check = out.checkpoints[id];
      requireValid(own(out.checkpoints, id) && object(record) && object(record.choices) && bool(record.submitted), '阶段检查');
      requireValid(!own(record, 'attemptId') || check.attemptId === record.attemptId, '阶段作答标识');
      requireValid(!own(record, 'submittedAt') || integer(record.submittedAt), '阶段提交时间');
      for (const [q, value] of Object.entries(record.choices)) requireValid(own(check.choices, q) && check.choices[q] === value, '阶段答案');
    }
    return out;
  }

  function examRecord(exam) {
    requireValid(object(exam) && ['ready', 'running', 'submitted'].includes(exam.status), '模考状态');
    requireValid(!own(exam, 'version') || [1, 2].includes(exam.version), '模考版本');
    const paperVersion = exam.contentVersion || 'legacy-1';
    const latest = window.PHYSICS_EXAM;
    const paper = exam.status === 'ready' || paperVersion === latest.contentVersion ? latest : window.PHYSICS_EXAM_LEGACY;
    requireValid(paper && (exam.status === 'ready' || paperVersion === latest.contentVersion || paperVersion === 'legacy-1'), '试卷版本');
    requireValid(['answers', 'written', 'drawings', 'marks'].every(key => object(exam[key])), '模考作答');
    const out = window.PhysicsExam.model.normalize(paper, exam);
    if (exam.status === 'ready') return out;
    requireValid(integer(exam.startedAt) && exam.startedAt > 0 && out.status === exam.status, '模考开始时间');
    requireValid(exam.submittedAt == null || integer(exam.submittedAt), '模考交卷时间');
    requireValid(exam.deadline == null || exam.deadline === out.deadline, '模考截止时间');
    requireValid(!own(exam, 'index') || exam.index === out.index, '模考题号');
    requireValid(!own(exam, 'flagged') || (Array.isArray(exam.flagged) && exam.flagged.every(id => out.flagged.includes(id))), '模考标记');
    for (const name of ['answers', 'written', 'drawings', 'marks', 'optionOrder']) {
      if (!own(exam, name)) continue;
      requireValid(object(exam[name]), '模考作答');
      for (const [id, entry] of Object.entries(exam[name])) {
        const value = out[name][id];
        requireValid(own(out[name], id), '模考题号');
        if (name === 'drawings' || name === 'optionOrder') {
          requireValid(JSON.stringify(entry) === JSON.stringify(value), '模考图形或选项顺序');
        } else if (name === 'marks') {
          requireValid(object(entry) && entry.confirmed === value.confirmed && JSON.stringify(entry.points) === JSON.stringify(value.points), '模考自评');
        } else {
          requireValid(entry === value, '模考答案');
        }
      }
    }
    return out;
  }

  function learningRecord(learning) {
    requireValid(object(learning) && learning.version === 2 && object(learning.items), '学习反馈');
    requireValid(!own(learning, 'migrated') || bool(learning.migrated), '学习反馈');
    const out = { version: 2, items: {}, migrated: learning.migrated === true };
    const itemFields = ['source', 'questionId', 'topic', 'lessonId', 'version', 'paperVersion', 'firstCorrect',
      'lastCorrect', 'cause', 'lastAt', 'lastWrongAt', 'attempts', 'needsReview', 'score', 'maxScore',
      'legacyAttempts', 'legacyFirstUnknown', 'legacyWrongAt', 'legacyNeedsReview'];
    for (const [key, item] of Object.entries(learning.items)) {
      requireValid(object(item) && ['practice', 'checkpoint', 'exam'].includes(item.source) && identifier(item.questionId) && key === item.source + ':' + item.questionId, '错题索引');
      requireValid(window.PhysicsLearning.definition(item), '错题题号');
      if (item.source === 'exam') requireValid(['legacy-1', window.PHYSICS_EXAM.contentVersion].includes(item.paperVersion), '错题试卷版本');
      requireValid(integer(item.version) && bool(item.lastCorrect) && (item.firstCorrect === null || bool(item.firstCorrect)), '错题作答');
      requireValid(Array.isArray(item.events) && (item.cause === '' || (typeof item.cause === 'string' && own(window.PhysicsLearning.causes, item.cause))), '错题原因或作答历史');
      for (const field of ['topic', 'lessonId', 'paperVersion']) requireValid(!own(item, field) || identifier(item[field]), '错题科目');
      for (const field of ['attempts', 'lastAt', 'lastWrongAt', 'legacyAttempts', 'legacyWrongAt', 'score', 'maxScore']) {
        requireValid(!own(item, field) || integer(item[field]), '错题次数或得分');
      }
      for (const field of ['needsReview', 'legacyNeedsReview', 'legacyFirstUnknown']) requireValid(!own(item, field) || bool(item[field]), '错题复习状态');
      const clean = Object.fromEntries(itemFields.filter(name => own(item, name)).map(name => [name, item[name]]));
      if (item.previousVersion != null) {
        const prev = item.previousVersion;
        requireValid(object(prev) && integer(prev.version) && integer(prev.attempts) && bool(prev.lastCorrect), '旧版错题历史');
        clean.previousVersion = { version: prev.version, attempts: prev.attempts, lastCorrect: prev.lastCorrect };
      }
      clean.events = [];
      for (const event of item.events) {
        requireValid(object(event) && identifier(event.attemptId) && integer(event.at) && bool(event.correct) && bool(event.independent) && integer(event.score) && integer(event.maxScore), '错题作答历史');
        const { attemptId, at, correct, independent, score, maxScore } = event;
        clean.events.push({ attemptId, at, correct, independent, score, maxScore });
      }
      // Recompute displayed counts and review state using the same rules as a new attempt.
      out.items[key] = window.PhysicsLearning.model.recompute(clean);
    }
    return out;
  }

  function parse(text) {
    requireValid(typeof text === 'string', '文件');
    if (text.length > MAX_BYTES || new Blob([text]).size > MAX_BYTES) throw new Error('文件超过 32 MB，请选择学习记录 JSON 文件。');
    const file = readJSON(text);
    if (!object(file) || file.app !== 'Physics Lab') throw new Error('这份文件不是物理自习室的学习记录，请选择本站下载的 JSON 备份。');
    requireValid(!own(file, 'schemaVersion') || file.schemaVersion === 1, '备份版本');
    if (own(file, 'schemaVersion')) requireValid(['course', 'exam', 'learning', 'practiceScope'].every(k => own(file, k)), '备份内容');
    const records = { main: mainRecord(file) };
    for (const [key, read] of [['course', courseRecord], ['exam', examRecord], ['learning', learningRecord]]) {
      if (own(file, key)) records[key] = file[key] === null ? null : read(file[key]);
    }
    if (own(file, 'practiceScope')) {
      requireValid(file.practiceScope === null || scopes.includes(file.practiceScope), '练习范围');
      records.practiceScope = file.practiceScope;
    }
    const missing = [];
    if (!own(records, 'course')) missing.push('课堂记录');
    if (!own(records, 'exam')) missing.push('模考记录');
    if (!own(records, 'practiceScope')) missing.push('练习范围');
    let exam = own(records, 'exam') ? '未开始' : '旧备份未收录';
    if (records.exam?.status === 'submitted') exam = '已交卷';
    if (records.exam?.status === 'running') exam = Date.now() < records.exam.deadline ? '进行中' : '已到交卷时间';
    const summary = Object.freeze({
      practice: Object.keys(records.main.answers).length, lessons: records.course?.done.length || 0,
      notes: Object.values(records.course?.notes || {}).filter(n => n.trim()).length, exam,
      read: records.main.read.length, focus: records.main.focusMinutes, missing: Object.freeze(missing),
      rebuiltLearning: !records.learning
    });
    const plan = Object.freeze({ summary });
    plans.set(plan, records);
    return plan;
  }

  // The earliest downloads held only the last answer to each exercise. Preserve
  // unaffected course/exam history, then reconstruct practice as in migratePractice.
  function legacyLearning(records, prior) {
    const items = {};
    if (prior && !own(records, 'learning') && (!own(records, 'course') || !own(records, 'exam'))) {
      const existing = readJSON(prior);
      requireValid(object(existing) && existing.version === 2 && object(existing.items), '本机学习反馈');
      const retained = Object.entries(existing.items).filter(([, item]) =>
        (item?.source === 'checkpoint' && !own(records, 'course')) || (item?.source === 'exam' && !own(records, 'exam')));
      Object.assign(items, learningRecord({ version: 2, items: Object.fromEntries(retained) }).items);
    }
    const questions = new Map(window.PHYSICS_CONTENT.questions.map(q => [q.id, q]));
    for (const [id, answer] of Object.entries(records.main.answers)) {
      const q = questions.get(id), at = Date.parse(answer.last) || Date.now(), wrongAt = answer.correct ? 0 : at;
      const attempts = answer.attempts;
      items['practice:' + id] = {
        source: 'practice', questionId: id, topic: q.topic, lessonId: q.lessonId, version: answer.version || 1,
        firstCorrect: attempts === 1 ? answer.correct : null, lastCorrect: answer.correct, lastAt: at,
        lastWrongAt: wrongAt, needsReview: !answer.correct, legacyNeedsReview: !answer.correct,
        legacyWrongAt: wrongAt, legacyAttempts: attempts, legacyFirstUnknown: attempts > 1, attempts, cause: '', events: []
      };
    }
    return { version: 2, items, migrated: true };
  }

  function restore(plan, storage) {
    const records = plans.get(plan);
    if (!records) throw new Error('请重新选择备份文件，再确认恢复。');
    const changes = [];
    try {
      storage = storage || window.localStorage;
      for (const [name, key] of Object.entries(KEYS)) {
        if (!own(records, name) && name !== 'learning') continue;
        const before = storage.getItem(key);
        let value = records[name];
        if (name === 'learning' && !value) value = legacyLearning(records, before);
        const after = name === 'practiceScope' || value === null ? value : JSON.stringify(value);
        if (after !== before) changes.push({ key, before, after });
      }
    } catch (error) {
      throw new Error('无法读取本机记录，恢复尚未开始。' + (error instanceof Error ? error.message : ''));
    }
    // Apply shrinking records first so replacing a near-full backup fits in quota.
    const sizeChange = entry => (entry.after?.length || 0) - (entry.before?.length || 0);
    changes.sort((a, b) => sizeChange(a) - sizeChange(b));
    const touched = [];
    function write(key, value) {
      if (value === null) storage.removeItem(key);
      else storage.setItem(key, value);
      if (storage.getItem(key) !== value) throw new Error('写入后读取结果不一致');
    }
    try {
      for (const change of changes) {
        if (storage.getItem(change.key) !== change.before) throw new Error('另一页面正在更新记录');
        touched.push(change);
        write(change.key, change.after);
      }
      for (const change of changes) {
        if (storage.getItem(change.key) !== change.after) throw new Error('另一页面已更新记录');
      }
    } catch (_) {
      let restored = true;
      for (const change of touched.reverse()) {
        try {
          const current = storage.getItem(change.key);
          if (current === change.after) write(change.key, change.before);
          else if (current !== change.before) restored = false;
        } catch (_) { restored = false; }
      }
      throw new Error(restored ? '恢复失败，本机原有记录已保留。请检查浏览器存储权限或剩余空间后重试。' : '恢复中断，浏览器无法还原全部原记录。请保留备份文件，检查存储权限后重新恢复。');
    }
  }

  window.PhysicsBackup = { MAX_BYTES, parse, restore };
})();

const formulaBookNames = ['测量与力学', '热学、波与光', '电学、原子与太空'];
const bookletFormulas = C.topics.flatMap(t => t.formulas)
  .sort((a, b) => a.book - b.book || a.order - b.order);

function selectedFormulaBook() {
  const params = new URLSearchParams(location.hash.split('?')[1] || '');
  const book = Number(params.get('book'));
  return [1, 2, 3].includes(book) ? book : 1;
}

function formulaEntry(f) {
  const source = `第 ${f.book} 册 · PDF 第 ${f.pages.join('、')} 页`;
  return `<article class="formula-card">
    <h3>${esc(f.meaning)}</h3>
    <div class="book-equation">${f.math}</div>
    ${f.condition ? `<p>${esc(f.condition)}</p>` : ''}
    <small>${esc(source)}${f.given ? ' · 原题给式' : ''}</small>
  </article>`;
}

function topicFormulas(t) {
  if (!t.formulas.length) return '';
  return '<details class="formula-chapter"><summary>查看讲义公式</summary><div class="topic-formulas">' +
    t.formulas.map(formulaEntry).join('') + '</div></details>';
}

function formulasPage() {
  const selected = selectedFormulaBook();
  const bookLinks = formulaBookNames.map((name, i) => {
    const book = i + 1;
    return `<a href="#formulas?book=${book}" ${selected === book ? 'aria-current="page"' : ''}>
      <strong>第 ${book} 册</strong><span>${name}</span></a>`;
  }).join('');
  return pageIntro('公式速查','按学校的三本 Pre-Q 讲义查公式。页码按 PDF 阅读器显示。') +
    `<nav class="formula-books" aria-label="选择物理讲义">${bookLinks}</nav>
    <div class="toolbar formula-toolbar">
      <input class="search-input" id="formula-search" type="search" aria-label="搜索公式" placeholder="搜索三册公式，如「折射率」">
      <button class="print-button" data-action="print">打印三册公式</button>
    </div><div id="formula-results">${formulaCards('')}</div>`;
}

function formulaSearchText(value) {
  return value.normalize('NFKC').toLowerCase().replace(/[\s_{}]/g, '');
}

function formulaCards(search, printAll = false) {
  const query = formulaSearchText(search);
  const book = selectedFormulaBook();
  const sections = [];
  for (const [index, bookName] of formulaBookNames.entries()) {
    const current = index + 1;
    if (!query && !printAll && current !== book) continue;
    const chapters = new Map();
    for (const f of bookletFormulas) {
      if (f.book !== current) continue;
      const fields = [f.meaning, f.formula, f.chapter, f.keywords, bookName, f.condition];
      if (query && !fields.some(field => formulaSearchText(field).includes(query))) continue;
      if (!chapters.has(f.chapter)) chapters.set(f.chapter, []);
      chapters.get(f.chapter).push(f);
    }
    if (!chapters.size) continue;
    const heading = query || printAll ? `<h2>第 ${current} 册 · ${bookName}</h2>` : '';
    const groups = Array.from(chapters, ([title, rows], i) => {
      const open = query || printAll || i === 0;
      return `<details class="formula-chapter"${open ? ' open' : ''}><summary>${esc(title)}</summary>
        <div class="formula-grid">${rows.map(formulaEntry).join('')}</div></details>`;
    }).join('');
    sections.push(`<section class="formula-volume" aria-label="第 ${current} 册">${heading}${groups}</section>`);
  }
  return sections.join('') || '<p class="field-hint">没有匹配的公式，换一个关键词试试。</p>';
}

function render(){const hash=location.hash.slice(1)||'overview';const [page,query]=hash.split('?');route=labels[page]?page:'overview';window.PhysicsLabs?.destroy();window.PhysicsCourse?.destroy();window.PhysicsExam?.destroy();
if(route==='practice'&&query){const p=new URLSearchParams(query);const id=p.get('question');const t=p.get('topic');if(id&&C.questions.some(q=>q.id===id)&&(!quiz||quiz.mode!=='single-'+id))startQuiz([id],'single-'+id);else if(!id&&topic(t)&&(!quiz||quiz.mode!==t))startQuiz(C.questions.filter(q=>q.topic===t).map(q=>q.id),t);}
document.querySelectorAll('[data-nav]').forEach(a=>{a.classList.toggle('active',a.dataset.nav===route);if(a.dataset.nav===route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
document.getElementById('page-name').textContent=labels[route];
const pages={overview,learn:learnPage,exam:examPage,topics:topicsPage,practice:quizPage,mistakes:mistakesPage,formulas:formulasPage,papers:papersPage,resources:resourcesPage,lab:labPage};
main.innerHTML=pages[route]();badge();if(route==='lab')window.PhysicsLabs.mount(main);if(route==='learn')window.PhysicsCourse.mount(main);if(route==='exam')window.PhysicsExam.mount(main);}
const menuButton = document.getElementById('nav-toggle');
const siteMenu = document.getElementById('site-menu');
function setMenu(open) {
  menuButton.setAttribute('aria-expanded', String(open));
  siteMenu.classList.toggle('expanded', open);
}
menuButton.addEventListener('click', () => setMenu(menuButton.getAttribute('aria-expanded') !== 'true'));
siteMenu.addEventListener('click', event => {
  if (event.target.closest('a') && menuButton.getAttribute('aria-expanded') === 'true') {
    setMenu(false);
    main.focus({preventScroll:true});
  }
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && menuButton.getAttribute('aria-expanded') === 'true') {
    setMenu(false);
    menuButton.focus();
  }
});
function go(page){if(location.hash==='#'+page)render();else location.hash=page;}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;
if(a==='topic')showTopic(id);
else if(a==='read'){if(!state.read.includes(id)){state.read.push(id);save();}el.textContent='✓ 已标记读过';toast('已记录阅读进度；掌握程度由练习结果更新。');}
else if(a==='topic-learn'){document.getElementById('topic-dialog').close();go('learn?stage='+id);}
else if(a==='topic-quiz'){document.getElementById('topic-dialog').close();startQuiz(C.questions.filter(q=>q.topic===id).map(q=>q.id),id);go('practice?topic='+id);}
else if(a==='answer'&&!graded){selected=Number(el.dataset.index);render();document.querySelector('[data-action="answer"][data-index="'+selected+'"]')?.focus({preventScroll:true});}
else if(a==='submit'&&!graded&&selected!==null){const q=quiz.questions[quiz.index];graded=true;const correct=selected===q.answer;const prev=state.answers[q.id];state.answers[q.id]={selected,correct,version:q.version||1,attempts:(prev?.attempts||0)+1,last:new Date().toISOString()};learning?.record({source:'practice',questionId:q.id,topic:q.topic,lessonId:q.lessonId,version:q.version||1,correct,attemptId:quiz.attemptId,independent:true});quiz.results.push({id:q.id,correct});save();render();document.querySelector('[data-action="next"]')?.focus({preventScroll:true});if(learning?.getWarning())toast(learning.getWarning());}
else if(a==='next'&&graded){quiz.index++;selected=null;graded=false;render();window.scrollTo({top:0,behavior:'smooth'});}
else if(a==='restart'){startQuiz(null,'mixed');go('practice');}
else if(a==='wrong-quiz'){const ids=wrongIds();if(!ids.length){toast('目前没有待复习错题。');return;}startQuiz(ids,'mistakes');go('practice');}
else if(a==='single-quiz'){startQuiz([id],'mistakes');go('practice');}
else if(a==='quiz-mode')chooseQuiz(id);
else if(a==='print')window.print();
});
document.addEventListener('input',e=>{if(e.target.id==='topic-search'){const s=e.target.value.toLowerCase();document.getElementById('topic-results').innerHTML=C.topics.filter(t=>(t.title+' '+t.en+' '+t.tagline+' '+t.summary).toLowerCase().includes(s)).map(topicCard).join('')||'<p>没有匹配的主题，换一个关键词试试。</p>';}
if(e.target.id==='formula-search')document.getElementById('formula-results').innerHTML=formulaCards(e.target.value);
});
document.addEventListener('change',e=>{if(e.target.dataset?.learningKey){learning?.setCause(e.target.dataset.learningKey,e.target.value);return;}if(e.target.id==='practice-scope'){practiceScope=e.target.value;try{localStorage.setItem('physics-practice-scope',practiceScope);}catch(_){};startQuiz(null,'mixed');if(location.hash.includes('?'))location.hash='practice';else render();return;}if(e.target.id==='quiz-topic'){const t=e.target.value;if(t==='single')return;if(t==='mistakes'){const ids=wrongIds();if(!ids.length){toast('目前没有待复习错题。');render();return;}startQuiz(ids,'mistakes');}else if(['mixed','mixed20','mixed40','unseen'].includes(t)){if(t==='unseen'&&!C.questions.some(q=>inScope(q)&&!currentAnswer(q))){toast('所有题目已练过，试试错题或混合自测。');render();return;}startQuiz(null,t);}else startQuiz(C.questions.filter(q=>q.topic===t).map(q=>q.id),t);if(location.hash.includes('?'))location.hash='practice';else render();}});
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus();main.scrollIntoView({behavior:'smooth'});});
document.querySelectorAll('.dialog-close').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}}));
document.getElementById('topic-dialog').addEventListener('close',()=>{if(route==='topics'||route==='overview')render();});
function timerText(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function timerUI(){if(timerEnd)timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));document.getElementById('timer-display').textContent=timerText(timerRemaining);document.getElementById('timer-label').textContent=timerEnd?timerText(timerRemaining):timerRemaining===1500?'专注 25 分钟':timerText(timerRemaining);document.getElementById('timer-toggle').textContent=timerEnd?'暂停':timerRemaining===1500?'开始专注':'继续专注';if(timerEnd&&timerRemaining===0){timerEnd=null;clearInterval(timerInterval);timerInterval=null;state.focusMinutes+=25;save();toast('25 分钟专注完成。站起来，休息一下。');timerRemaining=1500;timerUI();if(route==='overview')render();}}
document.getElementById('focus-btn').addEventListener('click',()=>{timerUI();document.getElementById('focus-dialog').showModal();});
document.getElementById('timer-toggle').addEventListener('click',()=>{if(timerEnd){timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerEnd=null;clearInterval(timerInterval);timerInterval=null;}else{timerEnd=Date.now()+timerRemaining*1000;timerInterval=setInterval(timerUI,500);}timerUI();});
document.getElementById('timer-reset').addEventListener('click',()=>{timerEnd=null;clearInterval(timerInterval);timerInterval=null;timerRemaining=1500;timerUI();});
function downloadBackup() {
  try {
    const stored = key => JSON.parse(localStorage.getItem(key) || 'null');
    const data = {
      app: 'Physics Lab', schemaVersion: 1, exportedAt: new Date().toISOString(),
      ...state, practiceScope, course: stored('physics-course-v1'),
      exam: stored('physics-lab-exam-v1'), learning: learning?.exportState() || null
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const download = document.createElement('a');
    download.href = url;
    download.download = 'physics-lab-progress.json';
    download.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return '已发起下载。下次换设备时，点“导入学习记录”选择这个 JSON 文件。';
  } catch (_) {
    return '导出失败，无法读取完整记录。请保留当前页面并检查浏览器存储权限。';
  }
}
const importDialog = document.getElementById('import-dialog');
const importFile = document.getElementById('import-file');
const importStatus = document.getElementById('import-status');
const importPreview = document.getElementById('import-preview');
const restoreButton = document.getElementById('import-confirm');
let importGeneration = 0;
let backupToRestore = null;
function clearPreview() {
  importGeneration++;
  backupToRestore = null;
  restoreButton.disabled = true;
  importPreview.hidden = true;
  importStatus.textContent = '';
  importStatus.classList.remove('error');
}
document.getElementById('export-btn').addEventListener('click', () => toast(downloadBackup()));
document.getElementById('export-before-import').addEventListener('click', () => {
  importStatus.textContent = downloadBackup();
});
document.getElementById('import-btn').addEventListener('click', () => {
  clearPreview();
  importFile.value = '';
  importDialog.showModal();
});
importDialog.addEventListener('close', clearPreview);
importFile.addEventListener('change', async () => {
  clearPreview();
  const file = importFile.files[0];
  if (!file) return;
  const generation = importGeneration;
  try {
    const backup = window.PhysicsBackup;
    if (file.size > backup.MAX_BYTES) throw new Error('文件过大，请选择从物理自习室导出的 JSON 备份。');
    importStatus.textContent = '正在读取备份…';
    const text = await file.text();
    if (generation !== importGeneration) return;
    const result = backup.parse(text);
    const {practice,lessons,notes,exam,missing = []} = result.summary;
    const details = [`已练 ${practice} 题。`];
    if (!missing.includes('课堂记录')) details.push(`读过 ${lessons} 节课，有 ${notes} 条课堂笔记。`);
    if (!missing.includes('模考记录')) details.push(`模拟考：${exam}。`);
    if (exam === '进行中') details.push('计时按原截止时间继续。');
    if (exam === '已到交卷时间') details.push('原截止时间已过，进入模考后会自动交卷。');
    document.getElementById('import-summary').textContent = details.join('');
    const coverage = document.getElementById('import-coverage');
    coverage.hidden = !missing.length;
    coverage.textContent = missing.length ? `旧备份没有收录：${missing.join('、')}。这些项目会保留本机原有记录。` : '';
    backupToRestore = result;
    importStatus.textContent = '';
    importPreview.hidden = false;
    restoreButton.disabled = false;
  } catch (error) {
    if (generation !== importGeneration) return;
    importStatus.textContent = error.message || '读取失败，请重新选择备份。';
    importStatus.classList.add('error');
  }
});
const restoreSignal = 'physics-backup-reloaded';
restoreButton.addEventListener('click', () => {
  if (!backupToRestore) return;
  restoreButton.disabled = true;
  try {
    window.PhysicsBackup.restore(backupToRestore);
  } catch (error) {
    restoreButton.disabled = false;
    importStatus.textContent = error.message || '恢复失败，请先导出本机记录后重试。';
    importStatus.classList.add('error');
    return;
  }
  backupToRestore = null;
  try { sessionStorage.setItem(restoreSignal, 'yes'); } catch (_) {}
  try { localStorage.setItem(restoreSignal, String(Date.now())); } catch (_) {}
  window.location.reload();
});
window.addEventListener('storage', event => {
  if (event.key === restoreSignal && event.newValue) window.location.reload();
});
window.addEventListener('physics-learning-change',()=>badge());
window.addEventListener('hashchange',()=>{const target=new URLSearchParams(location.hash.split('?')[1]||'').get('question');if(target&&quiz?.mode==='single-'+target&&quiz.index>=quiz.questions.length)quiz=null;render();window.scrollTo({top:0,behavior:'instant'});});
render();
try {
  if (sessionStorage.getItem(restoreSignal)) {
    sessionStorage.removeItem(restoreSignal);
    toast('学习记录已恢复，可以继续学习。');
  }
} catch (_) {}
if(!storageOK)toast('当前浏览器无法读取本地记录，将从空白进度开始。');
window.PHYSICS_LAB={getState:()=>JSON.parse(JSON.stringify(state)),topicProgress};
})();
